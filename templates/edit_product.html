
{% extends "base.html" %}

{% block title %}Edit Product{% endblock %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow-sm">

        <div class="card-header">
            <h3 class="mb-0">Edit Product</h3>
        </div>

        <div class="card-body">

            <form method="POST">

                <div class="mb-3">
                    <label class="form-label">Product Name</label>
                    <input type="text"
                           name="name"
                           class="form-control"
                           value="{{ product.name }}"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Product Type</label>

                    <select name="product_type"
                            class="form-select" required>

                        <option value="Goods"
                            {% if product.product_type == "Goods" %}selected{% endif %}>
                            Goods
                        </option>

                        <option value="Service"
                            {% if product.product_type == "Service" %}selected{% endif %}>
                            Service
                        </option>

                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Sales Price (₹)</label>
                    <input type="number"
                           name="sales_price"
                           class="form-control"
                           min="0"
                           step="0.01"
                           value="{{ product.sales_price }}"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Cost Price (₹)</label>
                    <input type="number"
                           name="cost_price"
                           class="form-control"
                           min="0"
                           step="0.01"
                           value="{{ product.cost_price }}"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Notes</label>
                    <textarea name="notes"
                              class="form-control"
                              rows="3">{{ product.notes or "" }}</textarea>
                </div>

                <button type="submit" class="btn btn-success">
                    Save Changes
                </button>

                <a href="{{ url_for('products.products') }}"
                   class="btn btn-secondary">
                    Cancel
                </a>

            </form>

        </div>
    </div>

</div>

{% endblock %}
